<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Screen test</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Screen test">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<!--
  Kept Words — screen test.
  Finds a way to fill the whole iPhone screen with a see-through status bar.
  The page background is bright green: green showing at the bottom means the gap is part of the page
  (it can be filled); black means iOS isn't drawing the page there at all.
  Each tap switches to another way of sizing the picture. The magenta stripe marks the picture's bottom edge.
-->
<style>
  html { background: #19e04b; height: 100%; }
  body { margin: 0; height: 100%; font: 600 15px -apple-system, system-ui, sans-serif; color: #fff; -webkit-tap-highlight-color: transparent; }
  .pic { left: 0; right: 0; top: 0; background: linear-gradient(#1b1f4b, #6b3f7a 45%, #f29e7c 75%, #2b1d1a); }
  .pic::after { content: "BOTTOM EDGE ↓"; position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; font-size: 13px; letter-spacing: .1em; }
  .pic::before { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 12px; background: #ff2bd6; }
  .v-fixed .pic { position: fixed; bottom: 0; }
  .v-lvh .pic { position: fixed; height: 100lvh; }
  .v-vh .pic { position: fixed; height: 100vh; }
  .v-screen .pic { position: fixed; height: var(--screen-h); }
  .v-doc { overflow: visible; }
  .v-doc body { height: auto; min-height: calc(100% + env(safe-area-inset-top, 0px)); }
  .v-doc .pic { position: absolute; height: var(--screen-h); }
  #info { position: fixed; left: 16px; right: 16px; top: calc(env(safe-area-inset-top, 0px) + 40px); z-index: 2;
    background: rgba(0,0,0,.55); border-radius: 14px; padding: 14px 16px; line-height: 1.55; white-space: pre-line; }
  #probe { position: fixed; top: 0; left: 0; width: 1px; height: 100%; visibility: hidden;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); box-sizing: content-box; }
</style>
</head>
<body>
<div class="pic" id="pic"></div>
<div id="info"></div>
<div id="probe"></div>
<script>
const variants = [
  ["fixed", "Way 1: pinned to the top and bottom"],
  ["lvh", "Way 2: large-viewport height (100lvh)"],
  ["vh", "Way 3: classic viewport height (100vh)"],
  ["screen", "Way 4: exact screen height"],
  ["doc", "Way 5: page made taller than the screen"],
];
let n = 0;
function show() {
  const [key, label] = variants[n];
  document.documentElement.className = "v-" + key;
  const full = Math.max(screen.width, screen.height);
  document.documentElement.style.setProperty("--screen-h", full + "px");
  requestAnimationFrame(() => {
    const probe = document.getElementById("probe"), cs = getComputedStyle(probe);
    const pic = document.getElementById("pic").getBoundingClientRect();
    const standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
    document.getElementById("info").textContent =
      `${label}\n` +
      `Tap anywhere for the next way (${n + 1} of ${variants.length}).\n\n` +
      `screen ${screen.width}×${screen.height}\n` +
      `page ${innerWidth}×${innerHeight} · box ${Math.round(parseFloat(cs.height))}\n` +
      `visual ${window.visualViewport ? Math.round(visualViewport.height) : "?"} · root ${document.documentElement.clientHeight}\n` +
      `safe top ${parseFloat(cs.paddingTop)} · bottom ${parseFloat(cs.paddingBottom)}\n` +
      `picture bottom ${Math.round(pic.bottom)}\n` +
      (standalone ? "on Home Screen" : "NOT on Home Screen: add it with Share → Add to Home Screen");
  });
}
document.addEventListener("click", () => { n = (n + 1) % variants.length; show(); });
window.addEventListener("resize", show);
show();
</script>
</body>
</html>
