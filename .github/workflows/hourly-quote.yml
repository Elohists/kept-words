name: Hourly quote

on:
  schedule:
    - cron: "3 * * * *"   # a few minutes past every hour (UTC); GitHub may run it a little late
  workflow_dispatch:       # lets you send one now from the Actions tab

permissions:
  contents: write          # only used to keep the schedule from being paused (see the last step)

concurrency:
  group: hourly-quote
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-audit --no-fund web-push@3.6.7
      - run: node scripts/notify.cjs
        env:
          SCRIPT_URL: ${{ secrets.SCRIPT_URL }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: https://${{ github.repository_owner }}.github.io
          # "Run workflow" by hand is a test: send even during quiet hours
          IGNORE_QUIET: ${{ github.event_name == 'workflow_dispatch' }}
      # GitHub pauses scheduled jobs in repositories with no commits for 60 days.
      # An empty commit every ~45 days keeps the hourly quotes coming.
      - name: Keep the schedule running
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 24 * 3600 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep the hourly quote schedule running"
            git push
          fi
